# autopilot-watchdog: notify-only. It opens at most one open "autopilot stalled" issue and never
# relaunches, labels or edits anything else. Copy to .github/workflows/autopilot-watchdog.yml.
name: autopilot-watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time, so two overlapping runs cannot both open the issue.
concurrency:
  group: autopilot-watchdog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  watchdog:
    name: watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read the PRD issue number from autopilot.yaml
        id: charter
        shell: bash
        run: |
          set -euo pipefail
          if command -v yq >/dev/null 2>&1; then
            prd="$(yq '.dispatcher.prd_issue' autopilot.yaml)"
          else
            prd="$(sed -n 's/.*prd_issue:[[:space:]]*\([0-9][0-9]*\).*/\1/p' autopilot.yaml | head -n 1)"
          fi
          case "$prd" in
            ''|*[!0-9]*)
              echo "::error::dispatcher.prd_issue is missing or not a number in autopilot.yaml"
              exit 1
              ;;
          esac
          echo "prd=$prd" >> "$GITHUB_OUTPUT"

      - name: Report a stall (notify only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRD_ISSUE: ${{ steps.charter.outputs.prd }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          paused="$(gh issue view "$PRD_ISSUE" --json labels --jq '[.labels[].name] | index("autopilot:paused") != null')"
          if [ "$paused" = "true" ]; then
            echo "autopilot is paused on PRD issue #$PRD_ISSUE; nothing to report"
            exit 0
          fi

          ready="$(gh issue list --state open --label 'state:ready' --limit 1000 --json number --jq 'length')"
          if [ "$ready" -eq 0 ]; then
            echo "no ready tasks; nothing to report"
            exit 0
          fi

          # The issues endpoint also returns pull requests, so one call covers both.
          latest="$(gh api "repos/$GH_REPO/issues?state=all&sort=updated&direction=desc&per_page=1" --jq '.[0].updated_at // ""')"
          cutoff="$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          if [[ -n "$latest" && "$latest" > "$cutoff" ]]; then
            echo "latest activity $latest is inside the 2 hour window; not stalled"
            exit 0
          fi

          open="$(gh issue list --state open --limit 1000 --json title --jq '[.[] | select(.title == "autopilot stalled")] | length')"
          if [ "$open" -gt 0 ]; then
            echo "an open autopilot stalled issue already exists; nothing to add"
            exit 0
          fi

          body="$(printf '%s\n' \
            "The autopilot watchdog found ready tasks, no pause label on PRD issue #$PRD_ISSUE," \
            "and no issue or pull request activity since $cutoff (latest update: ${latest:-none})." \
            "" \
            "This report is notify-only. The watchdog did not relaunch, label or edit anything." \
            "Run: $RUN_URL")"
          gh issue create --title "autopilot stalled" --label "kind:bug" --label "prio:p1" --body "$body"
