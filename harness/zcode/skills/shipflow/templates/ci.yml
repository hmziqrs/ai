# autopilot-ci: the required checks for the default branch ruleset (templates/ruleset-main.json).
# Copy to .github/workflows/autopilot-ci.yml in the project. Jobs ci, acceptance and parity
# are the check names the ruleset requires; ai-review is posted by the reviewer GitHub App
# (scripts/post-review.ts), not by this workflow. No secrets are used.
name: autopilot-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Gate l1 (build, typecheck, lint)
        run: bun .zcode/skills/shipflow/scripts/run-gate.ts --charter autopilot.yaml --gate l1
      - name: Gate unit
        run: bun .zcode/skills/shipflow/scripts/run-gate.ts --charter autopilot.yaml --gate unit
      # Branch and base values go through env, never inline ${{ }} in the script, so a
      # crafted branch name cannot inject shell.
      - name: Gate protected (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          bun .zcode/skills/shipflow/scripts/run-gate.ts --charter autopilot.yaml --gate protected
          --base "$BASE_SHA" --branch "$HEAD_REF"

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Gate acceptance
        run: bun .zcode/skills/shipflow/scripts/run-gate.ts --charter autopilot.yaml --gate acceptance
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-acceptance
          path: .shipflow/gates/
          if-no-files-found: ignore

  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Gate parity
        run: bun .zcode/skills/shipflow/scripts/run-gate.ts --charter autopilot.yaml --gate parity
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-parity
          path: .shipflow/gates/
          if-no-files-found: ignore
